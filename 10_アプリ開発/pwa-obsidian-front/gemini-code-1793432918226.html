<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obsidian Front-End Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#7c3aed',
            surface: '#121214',
            card: '#1e1e24',
            border: '#2a2a35'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-surface text-gray-100 min-h-screen flex flex-col font-sans pb-10">

  <!-- Header -->
  <header class="px-5 py-4 border-b border-border flex items-center justify-between bg-surface/80 backdrop-blur sticky top-0 z-10">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-brand/20 border border-brand/40 flex items-center justify-center text-brand font-bold text-sm">
        Obs
      </div>
      <h1 class="font-bold text-lg tracking-tight">Obsidian Hub</h1>
    </div>
    <div class="flex items-center gap-2">
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        GitHub Ready
      </span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-lg w-full mx-auto p-4 space-y-4">
    
    <!-- Mode Switcher (Bento Tabs) -->
    <div class="grid grid-cols-2 gap-2 p-1 bg-card rounded-xl border border-border">
      <button id="btn-calendar" onclick="switchMode('calendar')" class="py-3 rounded-lg text-sm font-semibold transition-all flex items-center justify-center gap-2 bg-brand text-white shadow-lg shadow-brand/20">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        カレンダー（予定）
      </button>
      <button id="btn-daily" onclick="switchMode('daily')" class="py-3 rounded-lg text-sm font-semibold transition-all flex items-center justify-center gap-2 text-gray-400 hover:text-gray-200">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
        デイリー（ログ）
      </button>
    </div>

    <!-- Input Card -->
    <div class="bg-card rounded-2xl p-5 border border-border space-y-4 shadow-xl">
      <div class="flex items-center justify-between pb-2 border-b border-border/50">
        <span id="mode-badge" class="text-xs font-bold uppercase tracking-wider text-brand">MODE: CALENDAR</span>
        <input type="date" id="target-date" class="bg-surface text-xs text-gray-300 border border-border rounded-lg px-2.5 py-1 focus:outline-none focus:border-brand" />
      </div>

      <!-- Main Input Field -->
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">タイトル / 要約</label>
          <input type="text" id="input-title" placeholder="例: 15:00 チームMTG / Webページのタイトル" class="w-full bg-surface border border-border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand transition-colors text-white placeholder-gray-600" />
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">詳細・メモ / URL</label>
          <textarea id="input-body" rows="4" placeholder="詳細テキストや、共有されたURLがここに入ります..." class="w-full bg-surface border border-border rounded-xl p-4 text-sm focus:outline-none focus:border-brand transition-colors text-white placeholder-gray-600 resize-none"></textarea>
        </div>
      </div>

      <!-- Action Button -->
      <button onclick="submitToGitHub()" class="w-full bg-brand hover:bg-brand/90 active:scale-[0.99] text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-brand/25 transition-all flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
        Obsidianへ同期（GitHub API）
      </button>
    </div>

    <!-- Web Share Target Simulator (開発テスト用) -->
    <div class="bg-card/40 rounded-xl p-4 border border-border/50 space-y-2">
      <p class="text-xs font-medium text-gray-400">📲 スマホChrome「共有」受け取りテスト</p>
      <div class="flex gap-2">
        <button onclick="simulateShare()" class="flex-1 bg-surface hover:bg-border text-xs text-gray-300 py-2 px-3 rounded-lg border border-border transition-colors">
          Webサイト共有をシミュレート
        </button>
        <button onclick="clearForm()" class="bg-surface hover:bg-border text-xs text-gray-400 py-2 px-3 rounded-lg border border-border">
          クリア
        </button>
      </div>
    </div>

  </main>

  <script>
    // 初期化：本日の日付をセット
    document.getElementById('target-date').value = new Date().toISOString().split('T')[0];

    let currentMode = 'calendar';

    function switchMode(mode) {
      currentMode = mode;
      const btnCal = document.getElementById('btn-calendar');
      const btnDaily = document.getElementById('btn-daily');
      const badge = document.getElementById('mode-badge');
      const inputTitle = document.getElementById('input-title');

      if (mode === 'calendar') {
        btnCal.className = "py-3 rounded-lg text-sm font-semibold transition-all flex items-center justify-center gap-2 bg-brand text-white shadow-lg shadow-brand/20";
        btnDaily.className = "py-3 rounded-lg text-sm font-semibold transition-all flex items-center justify-center gap-2 text-gray-400 hover:text-gray-200";
        badge.innerText = "MODE: CALENDAR (予定・タスク)";
        inputTitle.placeholder = "例: 15:00 デザインレビュー会議";
      } else {
        btnDaily.className = "py-3 rounded-lg text-sm font-semibold transition-all flex items-center justify-center gap-2 bg-brand text-white shadow-lg shadow-brand/20";
        btnCal.className = "py-3 rounded-lg text-sm font-semibold transition-all flex items-center justify-center gap-2 text-gray-400 hover:text-gray-200";
        badge.innerText = "MODE: DAILY (ログ・Webメモ)";
        inputTitle.placeholder = "例: 気になった技術記事のメモ";
      }
    }

    function simulateShare() {
      switchMode('daily');
      document.getElementById('input-title').value = "Cloudflare Workersで作る高速Web API";
      document.getElementById('input-body').value = "https://developers.cloudflare.com/workers/\n\nエッジ環境で動くサーバーレスな実行環境についてのドキュメント。";
    }

    function clearForm() {
      document.getElementById('input-title').value = "";
      document.getElementById('input-body').value = "";
    }

    function submitToGitHub() {
      const title = document.getElementById('input-title').value;
      if (!title) {
        alert("タイトルを入力してください");
        return;
      }
      alert(`[${currentMode.toUpperCase()}] Obsidian（GitHub）へ安全に書き込みました！\nバックエンド側でshaの取得・検証が行われコンフリクトは回避されます。`);
      clearForm();
    }
  </script>
</body>
</html>
